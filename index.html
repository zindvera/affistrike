    <script>
        const WORKER_URL = "https://little-queen-f49a.vineetkum25.workers.dev";
        let chatContext = [];

        // Dynamic Databases loaded on bootstrap
        let affiliateDatabase = [];
        let predefinedQueries = [];

        // Pagination State Variables
        let masterRankedList = [];
        let currentRenderedIndex = 0;
        const BATCH_SIZE = 10;
        let uniqueIdBlock = null;

        // Extracts core root domain safely from any URL
        function getRootDomain(urlStr) {
            try {
                if (!urlStr || typeof urlStr !== 'string') return "";
                if (!urlStr.startsWith('http://') && !urlStr.startsWith('https://')) {
                    urlStr = 'https://' + urlStr;
                }
                const url = new URL(urlStr);
                let hostname = url.hostname.toLowerCase();
                if (hostname.startsWith('www.')) {
                    hostname = hostname.substring(4);
                }
                return hostname;
            } catch (e) {
                return "";
            }
        }

        // Fetch affiliate database parameters
        async function fetchAffiliateData() {
            try {
                const response = await fetch('affiliateData.json');
                if (response.ok) {
                    affiliateDatabase = await response.json();
                    console.log("Loaded affiliate data successfully.");
                }
            } catch (err) {
                console.error("Affiliate data fetch failed. Continuing cleanly.");
            }
        }

        // Fetch local predefined queries database relative to workspace directory
        async function fetchPredefinedQueries() {
            try {
                const response = await fetch('/list/data.json');
                if (response.ok) {
                    predefinedQueries = await response.json();
                    console.log("Loaded predefined queries list.");
                }
            } catch (err) {
                console.error("No local list/data.json file found or fetch failed. Standard AI fallback enabled.");
            }
        }

        // Cleans standard AI colons, separators, hyphens, and generic descriptions in titles
        function cleanPlatformName(rawName) {
            let name = rawName;
            const delimiters = [':', '-', '|'];
            for (let delim of delimiters) {
                if (name.includes(delim)) {
                    let parts = name.split(delim).map(p => p.trim());
                    let cleanPart = parts.find(p => !p.toLowerCase().includes('alternative'));
                    name = cleanPart || parts[parts.length - 1];
                    break;
                }
            }
            name = name.replace(/\([^)]*\)/g, '').trim();
            return name;
        }

        window.showError = function (msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3500);
        };

        window.moveInputToBottom = function () {
            const main = document.querySelector('main');
            const inputArea = document.getElementById('ui-input-area');
            main.appendChild(inputArea);
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        };

        // Generates hardened system instructions for standard prompt generation
        window.getSystemPrompt = function () {
            return `You are an expert AI Platform and Tool finder. Evaluate the user's search query and determine their intent.

            STRICT LOGIC RULES:
            1. If the user asks for a specific alternative (e.g., "Canva alternative") OR an actionable service (e.g., "Selling wall art"), return "type": "LIST".
               - Provide a list of up to 30 best matching websites.
               - THE 'name' FIELD MUST CONTAIN ONLY THE CLEAN, OFFICIAL BRAND NAME (e.g., "Sendinblue", "Carrd"). DO NOT include the query, introductory text, descriptors, colons, or phrases like "Alternative to" in the 'name' field. 
               - Format: { "name": "SiteName", "url": "https://...", "desc": "A concise description of what the site does and why it fits the user's need." }
            
            2. If the user query is vague or too broad (e.g., "Wall art", "Music", "Business"), return "type": "SUGGESTION".
               - Provide up to 5 clear, highly actionable search intents the user might have meant.
               - Format: "Platforms where wall art sellers can sell digital downloads"
            
            3. Respond ONLY in valid JSON format. No markdown blocks outside the JSON.

            JSON Structure Template:
            {
                "type": "LIST" or "SUGGESTION",
                "results": [
                    { "name": "Website Name", "url": "https://link.com", "desc": "Description text here." }
                ],
                "suggestions": [
                    "Actionable query suggestion 1",
                    "Actionable query suggestion 2"
                ]
            }`;
        };

        // Core Search Orchestrator Function
      
        // Core Search Orchestrator Function
        window.startSearch = async function (prefill = null) {
            const inputEl = document.getElementById('searchQuery');
            const query = prefill || inputEl.value.trim();

            if (query.length < 3) return;

            const loader = document.getElementById('global-loader');
            const btn = document.getElementById('btn-search');

            // Render User bubble immediately
            btn.disabled = true;
            btn.innerText = "Searching...";
            document.getElementById('chat-phase').classList.remove('hidden');
            loader.classList.remove('hidden');

            appendUserBubble(query);
            inputEl.value = "";
            moveInputToBottom();

            chatContext.push({ role: "user", parts: [{ text: query }] });

            // Normalize search string into "text1+text2" format
            const formattedQueryKey = query.replace(/\s+/g, '+').toLowerCase();

            // Check if search phrase matches static list database
            const matchedPredefined = predefinedQueries.find(entry => entry.query && entry.query.toLowerCase() === formattedQueryKey);
            const isPredefinedSearch = !!matchedPredefined;
            const predefinedResults = isPredefinedSearch ? (matchedPredefined.results || []) : [];

            // Execute zero-latency bypass if dataset has 30+ items OR if query has restrict enabled
            const isRestricted = isPredefinedSearch && matchedPredefined.restrict === true;
            
            if ((isPredefinedSearch && predefinedResults.length >= 30) || isRestricted) {
                console.log(isRestricted ? "Restricted query match! Bypassing LLM." : "Direct Static Cache Hit! Bypassing LLM.");
                processAndRenderResults(predefinedResults, isPredefinedSearch, predefinedResults);
                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Find Websites";
                return;
            }

            try {
                // Determine system instructions based on predefined status
                let systemInstructionText = getSystemPrompt();
                if (isPredefinedSearch && predefinedResults.length > 0) {
                    systemInstructionText = `You are an expert AI Platform and Tool finder. Evaluate the user's search query: "${query}".
                    
                    We have a curated starting database of websites: ${JSON.stringify(predefinedResults)}.
                    
                    STRICT COMPILATION RULES:
                    1. Verify each website in this curated database. If any are shut down, offline, or closed, remove them.
                    2. Keep active entries, and do not modify their structure.
                    3. Search the market to find other highly relevant, standard, and active alternative websites to expand this list.
                    4. The total list MUST NOT exceed 30 websites. Quality over quantity. DO NOT include obscure, low-quality, or unrelated websites just to fill space.
                    5. The 'name' field must contain ONLY the clean, official brand name (e.g. "Mailerlite"). Strictly avoid prefixes, colons, or generic descriptors like "Alternative".
                    6. Respond ONLY in valid JSON matching this schema:
                    {
                        "type": "LIST",
                        "results": [
                            { "name": "SiteName", "url": "https://...", "desc": "Description explaining fit." }
                        ]
                    }`;
                }

                // Call LLM generation pipeline
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: chatContext,
                        system_instruction: { parts: [{ text: systemInstructionText }] }
                    })
                });

                if (!res.ok) throw new Error("API Connection Interrupted");

                const data = await res.json();
                let aiRaw = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";

                if (aiRaw.includes("```")) {
                    const match = aiRaw.match(/\{[\s\S]*\}/);
                    if (match) aiRaw = match[0];
                }

                const parsed = JSON.parse(aiRaw);

                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Find Websites";

                if (parsed.type === "LIST" && parsed.results) {
                    processAndRenderResults(parsed.results, isPredefinedSearch, predefinedResults);
                } else if (parsed.type === "SUGGESTION") {
                    renderSuggestion(parsed);
                } else {
                    showError("We couldn't process results. Try adjusting your query.");
                }

                chatContext.push({ role: "model", parts: [{ text: aiRaw }] });
                moveInputToBottom();

            } catch (err) {
                console.error("Worker Execution Error:", err);
                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Find Websites";
                showError("Unable to fetch results. Please try again.");
                chatContext.pop();
            }
        };
        

        // Comprehensive 3-Tier Sorting Engine & Core Affiliate Transformer
        function processAndRenderResults(resultsArray, isPredefinedSearch, predefinedResultsList) {
            // Track exact original predefined sites to anchor them to Tier 1
            let predefinedNames = new Set();
            let predefinedDomains = new Set();

            if (isPredefinedSearch && predefinedResultsList) {
                predefinedResultsList.forEach(p => {
                    if (p.name) predefinedNames.add(p.name.toLowerCase());
                    const domain = getRootDomain(p.url);
                    if (domain) predefinedDomains.add(domain);
                });
            }

            let tier1 = []; // Locked Predefined Curations
            let tier2 = []; // Other Affiliate matches
            let tier3 = []; // Standard recommendations

            resultsArray.forEach(item => {
                const aiDomain = getRootDomain(item.url);
                let matchedAffiliate = null;

                // UNIVERSAL AFFILIATE SWEEP: Check ALL incoming links against our active affiliate DB
                if (affiliateDatabase.length > 0) {
                    matchedAffiliate = affiliateDatabase.find(aff => {
                        const affDomain = getRootDomain(aff.affiliate_url);
                        const isDomainMatch = aiDomain && affDomain && (aiDomain === affDomain);
                        const isNameMatch = aff.name && item.name && (aff.name.toLowerCase() === item.name.toLowerCase());
                        const isSubstringNameMatch = aff.name && item.name.toLowerCase().includes(aff.name.toLowerCase());
                        return isDomainMatch || isNameMatch || isSubstringNameMatch;
                    });
                }

                // Force substitution if monetized
                if (matchedAffiliate) {
                    item.name = matchedAffiliate.name;
                    item.url = matchedAffiliate.affiliate_url;
                    item.isMonetized = true;
                } else {
                    item.name = cleanPlatformName(item.name);
                    item.isMonetized = false;
                }

                // RANKING CLASSIFIER: Check origin and monetization status
                const cleanNameLower = item.name.toLowerCase();
                const currentDomain = getRootDomain(item.url);

                const isPredefined = isPredefinedSearch && (
                    predefinedNames.has(cleanNameLower) ||
                    (currentDomain && predefinedDomains.has(currentDomain))
                );

                if (isPredefined) {
                    item.isPredefined = true;
                    tier1.push(item);
                } else if (item.isMonetized) {
                    tier2.push(item);
                } else {
                    tier3.push(item);
                }
            });

            // Lock rankings smoothly: Predefined Tier 1 -> Other Affiliates Tier 2 -> Standard Tier 3
            masterRankedList = [...tier1, ...tier2, ...tier3];
            renderRankedList();
        }

        window.appendUserBubble = function (text) {
            const container = document.getElementById('messages-container');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble bubble-user`;
            bubble.innerText = text;
            container.appendChild(bubble);
        };

        // Render Pagination Container elements
        window.renderRankedList = function () {
            const container = document.getElementById('messages-container');

            currentRenderedIndex = 0;
            uniqueIdBlock = Date.now();

            const wrap = document.createElement('div');
            wrap.className = "section-card";
            wrap.id = `list-wrap-${uniqueIdBlock}`;

            let html = `<div class="website-list-container" id="list-container-${uniqueIdBlock}"></div>`;
            html += `<div class="text-center mt-3">
                        <button id="btn-show-more-${uniqueIdBlock}" class="show-more-link" onclick="showNextBatch()" style="display:none;">
                            Show More Options <span class="caret-down">▼</span>
                        </button>
                     </div>`;

            wrap.innerHTML = html;
            container.appendChild(wrap);

            showNextBatch();
        };

        // Multi-Batch "Peek-a-boo" Layout Renderer
        window.showNextBatch = function () {
            const listContainer = document.getElementById(`list-container-${uniqueIdBlock}`);
            const btnShowMore = document.getElementById(`btn-show-more-${uniqueIdBlock}`);

            // If we have an existing faded card from the previous batch, restore full visibility
            const existingPeek = listContainer.querySelector('.peek-card');
            if (existingPeek) {
                existingPeek.classList.remove('peek-card');
            }

            // Determine slice start point
            let start = currentRenderedIndex;
            let end = currentRenderedIndex + BATCH_SIZE;

            if (currentRenderedIndex > 0) {
                start = currentRenderedIndex + 1;
                end = currentRenderedIndex + BATCH_SIZE;
            }

            const nextBatch = masterRankedList.slice(start, end);

            let html = "";
            nextBatch.forEach((item, index) => {
                const globalIndex = start + index;
                const descId = `desc-${uniqueIdBlock}-${globalIndex}`;
                const btnId = `btn-${uniqueIdBlock}-${globalIndex}`;

                html += `
                    <div class="website-item" id="item-${uniqueIdBlock}-${globalIndex}">
                        <div class="website-link-wrapper">
                            <a href="${item.url}" target="_blank" class="website-link">
                                ${item.name}
                                <svg class="external-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        </div>
                        <div class="desc-wrapper">
                            <p id="${descId}" class="desc-clamped">${item.desc}</p>
                            <button id="${btnId}" class="read-more-btn" onclick="toggleClamp('${descId}', this)">Read more</button>
                        </div>
                    </div>
                `;
            });

            listContainer.insertAdjacentHTML('beforeend', html);

            // Compute line-clamp heights dynamically
            setTimeout(() => {
                nextBatch.forEach((_, index) => {
                    const globalIndex = start + index;
                    const descId = `desc-${uniqueIdBlock}-${globalIndex}`;
                    const btnId = `btn-${uniqueIdBlock}-${globalIndex}`;
                    const el = document.getElementById(descId);
                    const btn = document.getElementById(btnId);
                    if (el && btn && el.scrollHeight <= el.clientHeight) {
                        btn.style.display = 'none';
                    }
                });
            }, 150);

            // Determine if the 11th peek-a-boo card needs to be rendered
            const nextPeekIndex = end;
            if (nextPeekIndex < masterRankedList.length) {
                const peekItem = masterRankedList[nextPeekIndex];
                const descId = `desc-${uniqueIdBlock}-${nextPeekIndex}`;
                const btnId = `btn-${uniqueIdBlock}-${nextPeekIndex}`;

                const peekHtml = `
                    <div class="website-item peek-card" id="item-${uniqueIdBlock}-${nextPeekIndex}">
                        <div class="website-link-wrapper">
                            <a href="${peekItem.url}" target="_blank" class="website-link">
                                ${peekItem.name}
                                <svg class="external-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        </div>
                        <div class="desc-wrapper">
                            <p id="${descId}" class="desc-clamped">${peekItem.desc}</p>
                            <button id="${btnId}" class="read-more-btn" onclick="toggleClamp('${descId}', this)">Read more</button>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', peekHtml);

                setTimeout(() => {
                    const el = document.getElementById(descId);
                    const btn = document.getElementById(btnId);
                    if (el && btn && el.scrollHeight <= el.clientHeight) {
                        btn.style.display = 'none';
                    }
                }, 150);

                currentRenderedIndex = nextPeekIndex;
                btnShowMore.style.display = 'inline-flex';
            } else {
                currentRenderedIndex = masterRankedList.length;
                btnShowMore.style.display = 'none';
            }

            // Adjust smooth scroll focus offset on expansion click
            if (start > 0) {
                window.scrollBy({ top: 220, behavior: 'smooth' });
            }
        };

        window.renderSuggestion = function (data) {
            const container = document.getElementById('messages-container');
            const wrap = document.createElement('div');
            wrap.className = "suggestion-card";
            let html = `
                <p class="suggestion-title">Your search is a bit broad. What exactly are you looking for?</p>
                <ul class="suggestion-list">
            `;

            if (data.suggestions) {
                data.suggestions.forEach(suggestion => {
                    const safeSuggest = suggestion.replace(/'/g, "\\'");
                    html += `<li class="suggestion-item" onclick="startSearch('${safeSuggest}')">${suggestion}</li>`;
                });
            }

            html += `
                </ul>
                <div class="clarification-msg">
                    Please select a suggestion above or refine your intent in the search box below.
                </div>
            `;
            wrap.innerHTML = html;
            container.appendChild(wrap);
        };

        // Multi-line Clamping Logic swap
        window.toggleClamp = function (descId, btn) {
            const descEl = document.getElementById(descId);
            if (descEl.classList.contains('desc-clamped')) {
                descEl.classList.remove('desc-clamped');
                descEl.classList.add('desc-full');
                btn.innerText = 'Show less';
            } else {
                descEl.classList.remove('desc-full');
                descEl.classList.add('desc-clamped');
                btn.innerText = 'Read more';

                const rect = descEl.getBoundingClientRect();
                if (rect.top < 0) {
                    window.scrollBy({ top: rect.top - 100, behavior: 'smooth' });
                }
            }
        };

        // Bootstrap App Controller initialization
        async function initApp() {
            // Quietly preload both active databases
            await fetchAffiliateData();
            await fetchPredefinedQueries();

            // Run URL Query Parameter checking
            const urlParams = new URLSearchParams(window.location.search);
            const autoQuery = urlParams.get('query');
            if (autoQuery && autoQuery.trim() !== '') {
                // Wait briefly to allow early DOM threads to stabilize, then trigger search
                setTimeout(() => {
                    document.getElementById('searchQuery').value = autoQuery;
                    window.startSearch();
                }, 200);
            }

            // Dynamic rotating word carousels
            const words = ["platforms", "tools", "marketplaces", "alternatives"];
            let wordIndex = 0;
            const rotateEl = document.getElementById('rotating-word');

            if (rotateEl) {
                setInterval(() => {
                    rotateEl.classList.add('fade-hidden');
                    setTimeout(() => {
                        wordIndex = (wordIndex + 1) % words.length;
                        rotateEl.innerText = words[wordIndex];
                        rotateEl.classList.remove('fade-hidden');
                    }, 400);
                }, 2500);
            }

            // Hook Enter key presses
            const searchInput = document.getElementById('searchQuery');
            if (searchInput) {
                searchInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        window.startSearch();
                    }
                });
            }
        }

        // Run application on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>

</html>
